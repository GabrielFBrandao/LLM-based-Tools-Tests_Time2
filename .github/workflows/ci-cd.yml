# ============================================
# Pipeline CI/CD - GitHub Actions
# ============================================
# Decisão: Pipeline completo com múltiplos stages
# - Lint: Verificar qualidade de código
# - Test: Executar testes
# - Build: Construir imagens Docker
# - Deploy: Deploy automático

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Variáveis de ambiente globais
env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Job 1: Lint e Qualidade de Código
  # ============================================
  lint:
    name: Lint e Qualidade
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: ./backend
        run: npm ci

      - name: Executar ESLint
        working-directory: ./backend
        run: npm run lint || true
        # Decisão: || true para não bloquear pipeline (warning only)

      - name: Verificar formatação (Prettier)
        working-directory: ./backend
        run: npm run format:check || true

  # ============================================
  # Job 2: Testes Unitários
  # ============================================
  test-unit:
    name: Testes Unitários
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: ./backend
        run: npm ci

      - name: Executar testes unitários
        working-directory: ./backend
        run: npm run test:unit

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: unittests
          name: codecov-unit

  # ============================================
  # Job 3: Testes de Integração
  # ============================================
  test-integration:
    name: Testes de Integração
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: ./backend
        run: npm ci

      - name: Executar testes de integração
        working-directory: ./backend
        run: npm run test:integration

  # ============================================
  # Job 4: Build e Push Docker Images
  # ============================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]
    # Decisão: Só faz build se testes passarem
    
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Job 5: Deploy para Staging
  # ============================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    # Decisão: Deploy automático apenas em develop
    
    environment:
      name: staging
      url: https://staging.hotel-reservation.com

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy para Staging
        run: |
          echo "Deploying to staging environment..."
          # Aqui você adicionaria comandos específicos do seu provedor
          # Exemplos:
          # - AWS ECS/Fargate
          # - Kubernetes
          # - Docker Swarm
          # - Heroku
          # - DigitalOcean App Platform

      - name: Notificar Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deploy para Staging: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================
  # Job 6: Deploy para Production
  # ============================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    # Decisão: Deploy em produção requer aprovação manual
    
    environment:
      name: production
      url: https://hotel-reservation.com

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy para Production
        run: |
          echo "Deploying to production environment..."
          # Comandos de deploy para produção

      - name: Criar Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Notificar Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deploy para Production: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
