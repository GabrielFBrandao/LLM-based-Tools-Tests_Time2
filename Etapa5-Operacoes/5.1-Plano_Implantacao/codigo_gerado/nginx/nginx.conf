# =============================================================================
# nginx.conf — Configuração de produção para o Frontend React
#
# RESPONSABILIDADES:
# 1. Servir arquivos estáticos com cache agressivo (assets com hash Vite)
# 2. SPA fallback: rotas do React Router devolvem index.html
# 3. Proxy reverso para a API (evita CORS no browser)
# 4. Compressão gzip
# 5. Headers de segurança
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compressão gzip ────────────────────────────────────────────────────
    # DECISÃO: gzip reduz transferência de JS/CSS em ~70%.
    # min_length 1000: não comprime respostas pequenas (overhead > ganho).
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Headers de segurança ───────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Assets estáticos — cache agressivo ────────────────────────────────
    # Vite gera nomes com hash (ex: index-Bx3kZ8aQ.js).
    # Se o conteúdo muda, o hash muda — portanto cache-busting automático.
    # Cache-Control: 1 ano é seguro para assets com hash.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── index.html — sem cache ─────────────────────────────────────────────
    # DECISÃO: index.html nunca deve ser cacheado pelo browser.
    # É o ponto de entrada que referencia os assets com hash.
    # Se o index.html ficar em cache, o usuário não vê os novos assets.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Proxy reverso para a API ───────────────────────────────────────────
    # DECISÃO: Prefixo /api/ é roteado para o serviço Node.js interno.
    # Vantagens:
    #   - Browser faz requisições para o mesmo origin → sem CORS
    #   - A URL da API nunca é exposta ao frontend
    #   - Load balancer pode rotear /api/ para múltiplas instâncias da API
    location /api/ {
        proxy_pass         http://hotel-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts razoáveis para API
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── SPA Fallback ───────────────────────────────────────────────────────
    # DECISÃO: React Router usa client-side routing.
    # Se o usuário acessa /reservas/123 diretamente, o Nginx deve devolver
    # index.html — o React Router processa a rota no cliente.
    # try_files: tenta o arquivo real → pasta → volta para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health check endpoint ──────────────────────────────────────────────
    # Usado pelo load balancer / Docker healthcheck
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
