# Kubernetes Deployment - Backend (Production)
# Hotel Booking System - Stack 2 (Java + Spring Boot)
#
# Estratégia de Deploy:
# - Blue-Green para zero-downtime
# - Horizontal Pod Autoscaler
# - Resource limits e requests
# - Health checks e readiness probes
# - ConfigMaps e Secrets
# - Database connection pooling
# - Redis caching
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-blue
  labels:
    app: backend
    version: blue
    tier: backend
    environment: production
  namespace: hotel-booking-prod
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
      version: blue
  template:
    metadata:
      labels:
        app: backend
        version: blue
        tier: backend
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USERNAME; do
            echo "Waiting for database..."
            sleep 2
          done
        env:
        - name: DB_HOST
          value: "database"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: username
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      - name: wait-for-redis
        image: redis:7-alpine
        command:
        - sh
        - -c
        - |
          until redis-cli -h $REDIS_HOST -p $REDIS_PORT ping; do
            echo "Waiting for Redis..."
            sleep 2
          done
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      containers:
      - name: backend
        image: ghcr.io/hotel-booking-system/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: management
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://database:5432/hotel_booking"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: password
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
          value: "20"
        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
          value: "5"
        - name: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
          value: "30000"
        - name: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
          value: "1800000"
        - name: SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD
          value: "60000"
        - name: SPRING_REDIS_HOST
          value: "redis"
        - name: SPRING_REDIS_PORT
          value: "6379"
        - name: SPRING_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: password
        - name: SPRING_REDIS_TIMEOUT
          value: "2000ms"
        - name: SPRING_REDIS_LETTUCE_POOL_MAX_ACTIVE
          value: "8"
        - name: SPRING_REDIS_LETTUCE_POOL_MAX_IDLE
          value: "8"
        - name: SPRING_REDIS_LETTUCE_POOL_MIN_IDLE
          value: "0"
        - name: SPRING_CACHE_TYPE
          value: "redis"
        - name: SPRING_CACHE_REDIS_TIME_TO_LIVE
          value: "300000"
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info,metrics,prometheus,loggers"
        - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
          value: "always"
        - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
          value: "true"
        - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_STEP
          value: "30s"
        - name: LOGGING_LEVEL_ROOT
          value: "INFO"
        - name: LOGGING_LEVEL_COM_HOTEL_BOOKING
          value: "DEBUG"
        - name: LOGGING_LEVEL_ORG_SPRING_WEB
          value: "DEBUG"
        - name: LOGGING_LEVEL_ORG_HIBERNATE_SQL
          value: "DEBUG"
        - name: LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL
          value: "TRACE"
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: SENTRY_DSN
        - name: SENTRY_ENVIRONMENT
          value: "production"
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: NEW_RELIC_LICENSE_KEY
        - name: NEW_RELIC_APP_NAME
          value: "hotel-booking-backend"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+OptimizeStringConcat -XX:+UseCompressedOops -XX:+UseCompressedClassPointers"
        - name: SERVER_PORT
          value: "8080"
        - name: SERVER_TOMCAT_MAX_THREADS
          value: "200"
        - name: SERVER_TOMCAT_MIN_SPARE_THREADS
          value: "10"
        - name: SERVER_TOMCAT_MAX_CONNECTIONS
          value: "8192"
        - name: SERVER_TOMCAT_ACCEPT_COUNT
          value: "100"
        - name: SERVER_TOMCAT_CONNECTION_TIMEOUT
          value: "20000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2048Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /actuator/health
            port: management
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
      - name: log-shipper
        image: fluent/fluent-bit:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc
          readOnly: true
        env:
        - name: ELASTICSEARCH_HOST
          value: "elasticsearch:9200"
        - name: ELASTICSEARCH_INDEX
          value: "hotel-booking-logs"
      volumes:
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: backend-config
      - name: tmp
        emptyDir: {}
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      imagePullSecrets:
      - name: ghcr-secret
      nodeSelector:
        node-type: backend
        environment: production
      tolerations:
      - key: "backend"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname

---
