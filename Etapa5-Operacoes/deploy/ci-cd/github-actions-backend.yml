name: CI/CD Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install & Test - Etapa4 Testes
        working-directory: Etapa4-Testes/Stack1-Node-TS-Tests
        run: |
          npm ci || npm install
          npm test -- --runInBand
      - name: Build backend image
        run: |
          docker build -f Etapa5-Operacoes/deploy/docker/backend.Dockerfile -t ${{ github.repository }}-backend:$(git rev-parse --short HEAD) .
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag & Push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/$(basename ${{ github.repository }})-backend
          GIT_SHA=$(git rev-parse --short HEAD)
          docker tag ${{ github.repository }}-backend:${GIT_SHA} ${IMAGE}:${GIT_SHA}
          docker tag ${{ github.repository }}-backend:${GIT_SHA} ${IMAGE}:latest
          docker push ${IMAGE}:${GIT_SHA}
          docker push ${IMAGE}:latest

  deploy-staging:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag env
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Render k8s manifests
        run: |
          sed -i "s|your-registry/stack1-backend:latest|ghcr.io/${{ github.repository_owner }}/$(basename ${{ github.repository }})-backend:${TAG}|g" Etapa5-Operacoes/deploy/k8s/backend-deployment.yaml
      - name: Deploy to Kubernetes (example)
        run: |
          echo "kubectl apply -f Etapa5-Operacoes/deploy/k8s/backend-deployment.yaml"
          echo "kubectl apply -f Etapa5-Operacoes/deploy/k8s/frontend-deployment.yaml"
