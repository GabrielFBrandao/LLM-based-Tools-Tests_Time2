apiVersion: apps/v1
kind: Deployment
metadata:
  name: stack1-frontend
  labels:
    app: stack1-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: stack1-frontend
  template:
    metadata:
      labels:
        app: stack1-frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/stack1-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: stack1-frontend
spec:
  selector:
    app: stack1-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stack1-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: stack1.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stack1-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stack1-backend
                port:
                  number: 80
