apiVersion: apps/v1
kind: Deployment
metadata:
  name: stack1-backend
  labels:
    app: stack1-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: stack1-backend
  template:
    metadata:
      labels:
        app: stack1-backend
    spec:
      containers:
        - name: backend
          image: your-registry/stack1-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: stack1-backend
spec:
  selector:
    app: stack1-backend
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
