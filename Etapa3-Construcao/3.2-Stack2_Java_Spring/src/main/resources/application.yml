spring:
  datasource:
    url: jdbc:h2:mem:hotel;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2

server:
  port: 8080

# Comentários:
# - H2 em memória para desenvolvimento e testes rápidos.
# - ddl-auto update apenas para dev. Em produção, usar migrações.
