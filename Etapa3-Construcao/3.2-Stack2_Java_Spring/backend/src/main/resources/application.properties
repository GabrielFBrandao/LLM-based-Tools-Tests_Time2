# ============================================================
# application.properties — Sistema de Reserva de Hotel
# ============================================================

spring.application.name=hotel-reservas

# ── Banco de Dados (H2 em memória para desenvolvimento) ──────
# DECISÃO: H2 em dev/teste, PostgreSQL em produção (ADR-003).
# Profiles Spring permitem alternar sem mudar código.
spring.datasource.url=jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 habilitado para debug em desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──────────────────────────────────────────
# DECISÃO: create-drop em dev (recria schema a cada start).
# Em produção usar 'validate' + Flyway/Liquibase para migrations.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Desabilita Open Session in View — evita lazy loading fora da transaction
spring.jpa.open-in-view=false

# ── Serialização JSON ─────────────────────────────────────────
# Não serializar campos null (response mais limpo)
spring.jackson.default-property-inclusion=non_null
# Datas como ISO 8601 (não timestamp numérico)
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Servidor ──────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── Logging ───────────────────────────────────────────────────
logging.level.com.hotel=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
